---
# common parameters
n_cores: &cores 4
genome_assembly: GRCh37
reference_resources:
  hapmap3_coordinates: "GWASLab 4.0.2 bundled HapMap3 tables"
assembly_validation:
  min_hapmap3_matches: 10000

# This is an ordered dict that contains the order in which the steps are run.
run_sequence: !!omap
  - 1: 'basic_check'
  - 2: 'infer_build'
  - 3: 'fill_data'
  - 4: 'liftover'
  - 5: 'harmonize'
  - 6: 'sort_alphabetically'
  - 7: 'write_tsv'
  - 8: 'write_parquet'


steps:
  basic_check: # see https://cloufield.github.io/gwaslab/Standardization/
    params:
      run: True
    gl_params:
      threads: *cores
      normalize: True
      fix_id_kwargs:
        fixid: True
        overwrite: True
  infer_build: # see https://cloufield.github.io/gwaslab/InferBuild/
    params:
      run: True
  fill_data: # see https://cloufield.github.io/gwaslab/Conversion/#fill_data
    params:
      run: True
    gl_params:
      to_fill: ['MLOG10P', 'Z', 'CHISQ', 'EAF']
      overwrite: False
      extreme: True
  liftover: # see https://cloufield.github.io/gwaslab/LiftOver/
    params:
      run: True
      workspace: "outputs"
      workspace_subfolder: True
    gl_params:
      from_build: "19"
      to_build: "38"
      chain_path: "/group/diangelantonio/public_data/liftOver/hg19ToHg38.over.chain.gz"
      remove: False
  harmonize: # see https://cloufield.github.io/gwaslab/Harmonization/
    params:
      run: True
    gl_params:
      basic_check: False
      threads: *cores
  sort_alphabetically:
    params:
      run: True
  write_tsv:
    params:
      run: True
      workspace: "outputs"
      workspace_subfolder: True
    gl_params:
      fmt: "gwaslab"
      xymt_number: True
      to_csvargs:
        compression:
          method: "gzip"
          compresslevel: 1
          mtime: 1
  write_parquet:
    params:
      run: True
      workspace: "outputs"
      workspace_subfolder: True
    gl_params:
      fmt: "gwaslab"
      tab_fmt: "parquet"


# Filename transformation, e.g.: seq.3007.7.liftover.vcf.gz
filename_mask: [ True, True, True, False, False, False]
filename_sep: '.'

# IO
root_path: "results"
log_filename: "gwaspipe.log"
formatbook_path: "workflow/scripts/gwaspipe/data/formatbook.json"     # fill this var if you want to provide a custom formatbook
